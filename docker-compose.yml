services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: nexops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexops -d nexops"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nexops:${POSTGRES_PASSWORD}@postgres:5432/nexops?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nexops:${POSTGRES_PASSWORD}@postgres:5432/nexops?schema=public
      NODE_ENV: production
      # PUBLIC_ORIGIN (e.g. http://192.168.1.50:3211 or https://nexops.example.com) pins the origin used in agent install commands.
      # Unset = the control plane uses the origin the browser/request used (so the enrol command follows whatever address you opened the dashboard on).
      NEXT_PUBLIC_APP_URL: ${PUBLIC_ORIGIN:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pgdata:
